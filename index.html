<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>ColorVerse | عالم التلوين</title>
  <style>
    html,body{margin:0;min-height:100%;background:#fffaf6;font-family:Arial,sans-serif;color:#10204c}
    .loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    .spinner{width:48px;height:48px;margin:auto;border:5px solid #eadfff;border-top-color:#7437ea;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body data-deploy="colorverse-gh-pages-bridge-v1">
  <div class="loading"><div><div class="spinner"></div><h1>جاري تحميل عالم التلوين…</h1></div></div>
  <script>
    (async()=>{
      const root='https://raw.githubusercontent.com/Mohammed-3bgarino0-lgtm/ColorVerse/gh-pages/';
      try{
        const response=await fetch(root+'index.html?ts='+Date.now(),{cache:'no-store'});
        if(!response.ok) throw new Error('HTTP '+response.status);
        let html=await response.text();
        html=html.replace('<head>','<head><base href="'+root+'">');
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        document.body.innerHTML='<div class="loading"><div><h1>تعذر تحميل المعاينة</h1><p>حدّث الصفحة بعد لحظات.</p><p>'+String(error)+'</p></div></div>';
      }
    })();
  </script>
</body>
</html>
