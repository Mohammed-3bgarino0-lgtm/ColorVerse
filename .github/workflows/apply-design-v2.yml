name: Apply Approved ColorVerse Design V2

on:
  push:
    paths:
      - '.bootstrap/design-v2/trigger.txt'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: colorverse-design-v2
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore approved design package
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/design-v2/part-* > /tmp/colorverse-design-v2.b64
          base64 --decode /tmp/colorverse-design-v2.b64 > /tmp/colorverse-design-v2.tar.xz
          xz --test /tmp/colorverse-design-v2.tar.xz
          tar -xJf /tmp/colorverse-design-v2.tar.xz -C .
          rm -rf .bootstrap/design-v2 .bootstrap/design-v1
          rm -f .github/workflows/apply-approved-design-v1.yml
          rm -f .github/workflows/apply-design-v2.yml

      - name: Save approved design to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply approved ColorVerse website design and official logo'
          git push origin HEAD:main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build GitHub Pages preview
        run: GITHUB_PAGES=true npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
