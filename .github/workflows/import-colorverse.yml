name: Import ColorVerse Source

on:
  push:
    paths:
      - '.bootstrap/source.b64'
      - '.github/workflows/import-colorverse.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and extract project
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/source.b64 > /tmp/colorverse-source.tar.xz
          xz --test /tmp/colorverse-source.tar.xz
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name '.bootstrap' -exec rm -rf {} +
          tar -xJf /tmp/colorverse-source.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/import-colorverse.yml

      - name: Commit complete project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import complete ColorVerse production source'
          git push origin HEAD:main
