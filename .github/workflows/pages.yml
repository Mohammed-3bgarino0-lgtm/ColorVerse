name: Deploy GitHub Pages Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import approved ColorVerse design package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/colorverse-design-v1.tar.xz \
            'https://drive.usercontent.google.com/download?id=1-2VMMW4Y5AzU5oPGRO0-lEbsu5TRNROJ&export=download&confirm=t'
          xz --test /tmp/colorverse-design-v1.tar.xz
          tar -xJf /tmp/colorverse-design-v1.tar.xz -C .
          rm -rf .bootstrap/design-v1
          rm -f .github/workflows/apply-approved-design-v1.yml

      - name: Save approved design to repository
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'Apply approved ColorVerse website design and official logo'
            git push origin HEAD:main
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static preview
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
