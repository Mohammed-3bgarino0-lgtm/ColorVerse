name: Link ColorVerse Creator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/link-create-page.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  link-creator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Link all primary CTAs to create.html
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          def replace_button(match):
              classes = ' '.join(c for c in match.group(1).split() if c != 'open-modal')
              label = match.group(2)
              return f'<a class="{classes}" href="create.html">{label}</a>'

          html = re.sub(
              r'<button class="([^"]*\bopen-modal\b[^"]*)">(.*?)</button>',
              replace_button,
              html,
              flags=re.S,
          )

          # Keep any old modal markup harmless while the real creator is now used.
          html = html.replace('id="createModal"', 'id="createModal" aria-hidden="true"')
          path.write_text(html, encoding='utf-8')

      - name: Commit linked landing page
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Landing page already linked.'
            exit 0
          fi
          git commit -m 'Link ColorVerse CTAs to five-step creator'
          git push origin HEAD:gh-pages
