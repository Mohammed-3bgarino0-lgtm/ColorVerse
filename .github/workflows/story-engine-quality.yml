name: Story Engine Quality

on:
  push:
    branches:
      - feature/story-studio-integration
    paths:
      - 'src/lib/story-*.ts'
      - 'src/lib/generated-story-schema.ts'
      - 'src/lib/gemini-story-provider.ts'
      - 'src/server/story-api-router.ts'
      - 'scripts/test-story-ai-contract.ts'
      - 'scripts/validate-story-catalog.mjs'
      - 'public/data/story-references.json'
      - 'package.json'
      - 'tsconfig.story-engine.json'
      - '.github/workflows/story-engine-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: story-engine-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate story engine
        run: npm run quality:stories
