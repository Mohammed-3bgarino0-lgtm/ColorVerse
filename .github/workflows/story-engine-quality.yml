name: Story Engine Quality

on:
  push:
    branches:
      - feature/story-studio-integration
    paths:
      - 'src/lib/story-*.ts'
      - 'src/lib/generated-story-schema.ts'
      - 'src/lib/gemini-story-provider.ts'
      - 'src/lib/google-drive-*.ts'
      - 'src/server/story-*.ts'
      - 'src/server/google-drive-api-router.ts'
      - 'server.ts'
      - 'public/js/story-*.js'
      - 'public/js/book-print-v3-runtime.js'
      - 'public/js/book-drive-archive-runtime.js'
      - 'public/css/book-print-v3.css'
      - 'public/css/book-editions-v4.css'
      - 'create-ai-review.html'
      - 'book-print-ai-review.html'
      - 'scripts/apply-story-studio-integration.mjs'
      - 'scripts/test-story-ai-contract.ts'
      - 'scripts/test-story-image-editions.ts'
      - 'scripts/validate-story-catalog.mjs'
      - 'scripts/validate-parent-review-runtime.mjs'
      - 'scripts/validate-book-print-review.mjs'
      - 'scripts/validate-story-image-runtime.mjs'
      - 'scripts/validate-google-drive-storage.mjs'
      - 'public/data/story-references.json'
      - '.env.example'
      - 'package.json'
      - 'tsconfig.story-engine.json'
      - '.github/workflows/story-engine-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: story-engine-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate story, image editions, review, PDFs, and Drive storage
        run: npm run quality:stories
