<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7437ea">
<title>كتاب الطفل | ColorVerse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
<style>
:root{--navy:#10204c;--purple:#7437ea;--pink:#ef4f9a;--orange:#ff7a18;--green:#159967;--muted:#68738d}
*{box-sizing:border-box}html,body{margin:0;background:#ece9f2;color:var(--navy);font-family:Tajawal,Inter,sans-serif}.toolbar{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 18px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-bottom:1px solid #ddd7e7}.group{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:43px;padding:0 15px;border-radius:13px;border:0;text-decoration:none;font-weight:900;cursor:pointer}.primary{color:#fff;background:linear-gradient(100deg,var(--purple),var(--pink),var(--orange))}.secondary{color:var(--navy);background:#fff;border:1px solid #d8d1e5}.status{font-size:12px;color:var(--muted)}.wrap{padding:26px 10px 60px}.book{width:210mm;margin:auto}.sheet{position:relative;width:210mm;height:297mm;margin:0 auto 20px;background:#fff;overflow:hidden;page-break-after:always;break-after:page;box-shadow:0 18px 55px rgba(22,15,48,.18)}.sheet:last-child{page-break-after:auto}.cover-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,16,45,.05),rgba(7,16,45,.2) 40%,rgba(7,16,45,.93))}.logo{height:26mm;width:auto;object-fit:contain}.cover-top{position:absolute;top:13mm;left:13mm;right:13mm;display:flex;justify-content:space-between;align-items:flex-start}.chip{padding:3mm 5mm;border-radius:999px;background:rgba(255,255,255,.9);color:#5f31bd;font-size:10pt;font-weight:900}.hero-photo{position:absolute;top:42mm;left:50%;transform:translateX(-50%);width:72mm;height:88mm;border-radius:34mm 34mm 24mm 24mm;overflow:hidden;border:3mm solid rgba(255,255,255,.95);box-shadow:0 12mm 25mm rgba(14,18,55,.3);background:#f4edff;display:none}.hero-photo img{width:100%;height:100%;object-fit:cover}.cover-copy{position:absolute;left:14mm;right:14mm;bottom:18mm;color:#fff;text-align:center}.cover-copy h1{font-size:31pt;line-height:1.22;margin:0;text-shadow:0 3px 13px rgba(0,0,0,.4);font-weight:900}.cover-copy p{margin:5mm 0 0;font-size:16pt;font-weight:800}.cover-copy small{display:inline-block;margin-top:5mm;padding:2.5mm 5mm;border-radius:999px;background:rgba(255,255,255,.17);font-size:10.5pt}.opening{background:radial-gradient(circle at 15% 15%,rgba(116,55,234,.14),transparent 28%),radial-gradient(circle at 85% 10%,rgba(255,122,24,.14),transparent 25%),#fffaf6}.center-page{position:absolute;inset:22mm 18mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.center-page h2{font-size:27pt;margin:11mm 0 4mm}.center-page p{font-size:15pt;line-height:2;color:#45516d;max-width:155mm}.credit{margin-top:8mm;padding:5mm 8mm;border-radius:6mm;background:#effcf6;color:#176a4c;border:1px solid #ccebdc;font-size:13pt;font-weight:900}.meta{width:150mm;margin-top:10mm;display:grid;grid-template-columns:1fr 1fr;gap:4mm}.meta div{padding:4mm;border-radius:4mm;background:#fff;border:1px solid #e7dff0;text-align:right}.meta span{display:block;color:#7a8295;font-size:9pt}.meta b{display:block;margin-top:1mm;font-size:12pt}.page-inner{position:absolute;inset:13mm;display:flex;flex-direction:column}.page-head{height:19mm;display:flex;align-items:center;justify-content:space-between}.mini-logo{height:16mm;width:auto}.scene-chip{padding:2.5mm 4.5mm;border-radius:999px;background:#f3edff;color:#6e34d5;font-size:9pt;font-weight:900}.story-img{width:100%;height:170mm;object-fit:cover;border-radius:8mm;box-shadow:0 5mm 14mm rgba(31,20,75,.13)}.story-box{margin-top:7mm;padding:7mm 8mm;border-radius:7mm;background:#fffaf0;border:1px solid #f0e0bf;min-height:62mm}.story-box h3{font-size:18pt;margin:0 0 3mm}.story-box p{font-size:13pt;line-height:1.95;margin:0;color:#35405c}.coloring-frame{height:235mm;border:1.2mm solid #222;border-radius:7mm;padding:5mm;display:flex;align-items:center;justify-content:center;background:#fff}.coloring-frame img{width:100%;height:100%;object-fit:contain;filter:grayscale(1) contrast(1.1)}.coloring-title{text-align:center;margin-top:5mm;font-size:13pt;font-weight:900}.page-num{position:absolute;bottom:7mm;left:0;right:0;text-align:center;font:700 9pt Inter;color:#8c93a4}.ending{background:linear-gradient(145deg,#f4edff,#fff2e4)}.ending h2{font-size:30pt;margin:12mm 0 5mm}.ending .signature{width:128mm;margin-top:16mm;padding:8mm;border-radius:7mm;background:#fff;border:1px dashed #bfb4d2}.signature span{display:block;color:#7d8699}.signature strong{display:block;margin-top:12mm;border-top:1px solid #aaa;padding-top:3mm}.empty{min-height:70vh;display:grid;place-items:center;text-align:center;padding:30px}.empty-card{max-width:560px;background:#fff;padding:30px;border-radius:25px;box-shadow:0 22px 70px rgba(49,31,102,.15)}
@page{size:A4 portrait;margin:0}@media print{html,body{background:#fff}.toolbar{display:none!important}.wrap{padding:0}.sheet{margin:0;box-shadow:none}}@media(max-width:850px){.toolbar{align-items:flex-start}.status{display:none}.wrap{overflow:auto}.book{margin-right:0}}
</style>
</head>
<body>
<div class="toolbar"><div class="group"><a class="btn secondary" href="create.html">← تعديل القصة</a><strong>كتاب الطفل الجاهز للطباعة</strong></div><div class="group"><span class="status" id="status">جاري تجهيز الصفحات…</span><button class="btn secondary" id="printBtn">طباعة / حفظ PDF</button><button class="btn primary" id="pdfBtn">تنزيل PDF</button></div></div>
<div class="wrap"><main class="book" id="book"></main></div>
<script>
const KEY='colorverse-book-draft-v3',PHOTO_KEY='colorverse-child-photo', $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let draft={};try{draft=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{}const photo=localStorage.getItem(PHOTO_KEY)||'';
const templates={space:{cover:'public/marketing/cover-space.webp',story:'public/marketing/hero-story-page.webp',coloring:'public/marketing/hero-coloring-page.webp',label:'الفضاء'},princess:{cover:'public/marketing/cover-princess.webp',story:'public/marketing/hero-story-page.webp',coloring:'public/marketing/hero-coloring-page.webp',label:'عالم الأميرات'},jungle:{cover:'public/marketing/cover-jungle.webp',story:'public/marketing/hero-story-page.webp',coloring:'public/marketing/hero-coloring-page.webp',label:'الغابة'},hero:{cover:'public/marketing/cover-hero.webp',story:'public/marketing/hero-story-page.webp',coloring:'public/marketing/hero-coloring-page.webp',label:'عالم الأبطال'},unicorn:{cover:'public/marketing/cover-unicorn.webp',story:'public/marketing/hero-story-page.webp',coloring:'public/marketing/hero-coloring-page.webp',label:'اليونيكورن'}};
function getTitle(){const h=(draft.heroName||draft.childName||'البطل الصغير').trim();if(draft.customTitle)return draft.customTitle;if((draft.moral+' '+draft.adventure).includes('بخل'))return h+' وسر صندوق المشاركة';if((draft.moral+' '+draft.adventure).includes('وفاء'))return h+' ووعد الصديق الوفي';const m={space:'مغامرة '+h+' بين النجوم',princess:h+' وسر القصر الساحر',jungle:h+' وأصدقاء الغابة',hero:'البطل '+h+' ينقذ المدينة',unicorn:h+' وقوس القزح السحري'};return m[draft.template]||h+' في مغامرة مدهشة'}
function sheet(content,cls=''){return `<section class="sheet ${cls}">${content}</section>`}
function build(){if(!draft.childName||!draft.template){$('#book').innerHTML='<div class="empty"><div class="empty-card"><h1>لا توجد قصة جاهزة</h1><p>ارجع إلى استوديو القصة وأكمل خطوات الإنشاء أولًا.</p><a class="btn primary" href="create.html">فتح الاستوديو</a></div></div>';$('#status').textContent='لا توجد بيانات';return}
const t=templates[draft.template],title=getTitle(),hero=draft.heroName||draft.childName,plan=Array.isArray(draft.storyPlan)&&draft.storyPlan.length?draft.storyPlan:[],pages=[];
pages.push(sheet(`<img class="cover-bg" src="${esc(draft.cover||t.cover)}" alt=""><div class="shade"></div><div class="cover-top"><img class="logo" src="public/brand/colorverse-logo-full.webp" alt="ColorVerse"><span class="chip">${esc(draft.coverStyle||'غلاف أساسي')}</span></div><div class="hero-photo" id="heroPhoto">${photo?`<img src="${photo}" alt="صورة البطل">`:''}</div><div class="cover-copy"><h1>${esc(title)}</h1><p>فكرة وتأليف: ${esc(draft.childName)}</p><small>بطولة ${esc(hero)} • ${esc(t.label)}</small></div>`));
pages.push(sheet(`<div class="center-page"><img class="logo" src="public/brand/colorverse-logo-full.webp" alt=""><h2>${esc(title)}</h2><p>صُنعت هذه القصة من خيال ${esc(draft.childName)}، ثم نُظمت لتصبح تجربة قراءة ممتعة تحافظ على فكرته وشخصياته وقيمته التربوية.</p><div class="credit">✍️ الفكرة والتأليف: ${esc(draft.childName)}</div><div class="meta"><div><span>اسم البطل</span><b>${esc(hero)}</b></div><div><span>العمر</span><b>${esc(draft.age)} سنوات</b></div><div><span>القيمة</span><b>${esc(draft.moral||'التعلم من التجربة')}</b></div><div><span>طريقة الإنشاء</span><b>${esc(draft.creationMode||'فكرة حرة')}</b></div></div></div>`,'opening'));
const count=Math.max(4,Math.min(16,Number(draft.pages)||8)),sceneCount=Math.min(count,plan.length||8),storyOnly=draft.output==='قصة فقط';
for(let i=0;i<sceneCount;i++){const scene=plan[i]||{title:'مشهد '+(i+1),text:draft.childStory||draft.adventure};pages.push(sheet(`<div class="page-inner"><div class="page-head"><img class="mini-logo" src="public/brand/colorverse-logo-full.webp" alt=""><span class="scene-chip">المشهد ${i+1}</span></div><img class="story-img" src="${esc(t.story)}" alt=""><div class="story-box"><h3>${esc(scene.title)}</h3><p>${esc(scene.text)}</p></div><span class="page-num">${pages.length+1}</span></div>`));if(!storyOnly){pages.push(sheet(`<div class="page-inner"><div class="page-head"><img class="mini-logo" src="public/brand/colorverse-logo-full.webp" alt=""><span class="scene-chip">صفحة تلوين ${i+1}</span></div><div class="coloring-frame"><img src="${esc(t.coloring)}" alt=""></div><div class="coloring-title">لوّن مشهد: ${esc(scene.title)}</div><span class="page-num">${pages.length+1}</span></div>`))}}
pages.push(sheet(`<div class="center-page ending"><img class="logo" src="public/brand/colorverse-logo-full.webp" alt=""><h2>أحسنت يا ${esc(draft.childName)}!</h2><p>أنت صاحب الفكرة ومؤلف هذه القصة. كل كتاب يبدأ بخيال صغير، ثم يكبر بالقراءة والكتابة والمشاركة.</p><div class="signature"><span>توقيع المؤلف الصغير</span><strong>${esc(draft.childName)}</strong></div></div>`,'ending'));
$('#book').innerHTML=pages.join('');if(photo)$('#heroPhoto').style.display='block';$('#status').textContent=pages.length+' صفحة جاهزة'}
$('#printBtn').onclick=()=>window.print();$('#pdfBtn').onclick=async()=>{const btn=$('#pdfBtn');btn.disabled=true;btn.textContent='جاري إنشاء PDF…';try{if(!window.html2pdf)throw new Error('PDF library unavailable');await html2pdf().set({margin:0,filename:'ColorVerse-'+(draft.childName||'book')+'.pdf',image:{type:'jpeg',quality:.96},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from($('#book')).save()}catch(e){alert('تعذر التنزيل المباشر. استخدم زر طباعة / حفظ PDF.')}finally{btn.disabled=false;btn.textContent='تنزيل PDF'}};build();
</script>
</body></html>
