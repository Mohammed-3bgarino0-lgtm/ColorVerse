<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7437ea">
  <title>كتاب ColorVerse الجاهز للطباعة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
  <style>
    :root{--navy:#10204c;--muted:#68738d;--purple:#7437ea;--pink:#ef4f9a;--orange:#ff7a18;--green:#19a96b;--cream:#fffaf6;--shadow:0 22px 70px rgba(49,31,102,.15)}
    *{box-sizing:border-box}html{background:#edeaf3}body{margin:0;color:var(--navy);font-family:Tajawal,Inter,sans-serif;background:#edeaf3}button,a{font:inherit}.toolbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 18px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-bottom:1px solid #ddd8e8;box-shadow:0 8px 25px rgba(25,17,54,.08)}.toolbar-group{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.toolbar-title{font-weight:900}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:43px;padding:0 15px;border-radius:13px;border:0;text-decoration:none;font-weight:900;cursor:pointer}.btn-primary{color:#fff;background:linear-gradient(100deg,var(--purple),var(--pink),var(--orange))}.btn-secondary{color:var(--navy);background:#fff;border:1px solid #d8d1e5}.status{font-size:12px;color:var(--muted)}.book-wrap{padding:28px 10px 60px}.book{width:210mm;margin:auto}.sheet{position:relative;width:210mm;height:297mm;overflow:hidden;background:#fff;page-break-after:always;break-after:page;box-shadow:0 18px 55px rgba(22,15,48,.18);margin:0 auto 22px}.sheet:last-child{page-break-after:auto;break-after:auto}.logo{height:25mm;width:auto;object-fit:contain}.cover{color:#fff;background:#35216f}.cover-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cover-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,18,52,.06),rgba(10,19,52,.2) 42%,rgba(8,16,46,.92))}.cover-top{position:absolute;top:13mm;left:13mm;right:13mm;display:flex;align-items:flex-start;justify-content:space-between;gap:10mm}.cover-top .logo{filter:drop-shadow(0 5px 14px rgba(0,0,0,.25))}.cover-type{padding:3mm 5mm;border-radius:999px;background:rgba(255,255,255,.88);color:#5630a6;font-size:11pt;font-weight:900;backdrop-filter:blur(8px)}.hero-photo{position:absolute;top:42mm;left:50%;transform:translateX(-50%);width:72mm;height:88mm;border-radius:34mm 34mm 25mm 25mm;overflow:hidden;border:3mm solid rgba(255,255,255,.94);box-shadow:0 12mm 25mm rgba(14,18,55,.3);background:linear-gradient(145deg,#efe8ff,#ffe5ee);display:none}.hero-photo img{width:100%;height:100%;object-fit:cover}.cover-copy{position:absolute;left:14mm;right:14mm;bottom:18mm;text-align:center}.cover-copy h1{font-size:31pt;line-height:1.22;margin:0;text-shadow:0 3px 13px rgba(0,0,0,.4);font-weight:900}.cover-copy p{margin:5mm 0 0;font-size:16pt;color:rgba(255,255,255,.9);font-weight:700}.cover-copy small{display:inline-block;margin-top:5mm;padding:2.5mm 5mm;border-radius:999px;background:rgba(255,255,255,.16);font-size:10.5pt}.opening{background:radial-gradient(circle at 15% 15%,rgba(116,55,234,.14),transparent 28%),radial-gradient(circle at 85% 10%,rgba(255,122,24,.14),transparent 25%),#fffaf6}.opening-content{position:absolute;inset:22mm 18mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.opening .logo{height:33mm}.opening h2{font-size:27pt;margin:13mm 0 4mm}.opening .dedication{font-size:16pt;line-height:2;max-width:155mm;color:#45516d}.meta-card{width:145mm;margin-top:14mm;padding:7mm;border:1px solid #e6dff0;border-radius:8mm;background:rgba(255,255,255,.9);display:grid;grid-template-columns:1fr 1fr;gap:4mm 8mm;text-align:right}.meta-card div{padding:3mm;border-radius:4mm;background:#faf7ff}.meta-card span{display:block;font-size:9.5pt;color:#7a8295}.meta-card b{display:block;margin-top:1mm;font-size:12pt}.page-inner{position:absolute;inset:13mm;display:flex;flex-direction:column}.page-header{height:19mm;display:flex;align-items:center;justify-content:space-between;gap:8mm}.page-header .mini-logo{height:16mm;width:auto}.page-chip{padding:2.5mm 4.5mm;border-radius:999px;background:#f3edff;color:#6e34d5;font-size:9pt;font-weight:900}.story-image{width:100%;height:174mm;object-fit:cover;border-radius:8mm;box-shadow:0 5mm 14mm rgba(31,20,75,.13)}.story-box{margin-top:7mm;padding:7mm 8mm;border-radius:7mm;background:#fffaf0;border:1px solid #f0e0bf;min-height:59mm}.story-box h3{font-size:18pt;margin:0 0 3mm}.story-box p{font-size:13.5pt;line-height:1.9;margin:0;color:#35405c}.coloring-sheet{background:#fff}.coloring-frame{height:235mm;border:1.2mm solid #202020;border-radius:7mm;padding:5mm;display:flex;align-items:center;justify-content:center;background:#fff}.coloring-frame img{width:100%;height:100%;object-fit:contain;filter:grayscale(1) contrast(1.1)}.coloring-title{text-align:center;margin-top:5mm;font-size:13pt;font-weight:900}.page-number{position:absolute;bottom:7mm;left:0;right:0;text-align:center;font:700 9pt Inter;color:#8c93a4}.ending{background:linear-gradient(145deg,#f4edff,#fff2e4)}.ending-content{position:absolute;inset:25mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.ending .logo{height:38mm}.ending h2{font-size:30pt;margin:14mm 0 5mm}.ending p{font-size:16pt;line-height:2;color:#536079;max-width:150mm}.signature{width:125mm;margin-top:18mm;padding:8mm;border-radius:7mm;background:#fff;border:1px dashed #bfb4d2}.signature span{display:block;color:#7d8699;font-size:11pt}.signature strong{display:block;margin-top:12mm;border-top:1px solid #aaa;padding-top:3mm;font-size:11pt}.notice{max-width:210mm;margin:0 auto 16px;padding:12px 15px;border-radius:14px;background:#fff7df;color:#77540d;font-size:13px;line-height:1.7}.empty{min-height:70vh;display:grid;place-items:center;text-align:center;padding:30px}.empty-card{max-width:560px;background:#fff;padding:30px;border-radius:25px;box-shadow:var(--shadow)}
    @page{size:A4 portrait;margin:0}@media print{html,body{background:#fff}.toolbar,.notice{display:none!important}.book-wrap{padding:0}.book{width:210mm}.sheet{margin:0;box-shadow:none}}@media(max-width:850px){.toolbar{align-items:flex-start}.toolbar-title{display:none}.book-wrap{overflow:auto}.status{display:none}}
  </style>
</head>
<body>
  <div class="toolbar"><div class="toolbar-group"><a class="btn btn-secondary" href="create.html">← تعديل الكتاب</a><span class="toolbar-title">قالب الكتاب الجاهز للطباعة</span></div><div class="toolbar-group"><span class="status" id="status">يتم تجهيز الصفحات…</span><button class="btn btn-secondary" id="printBtn">طباعة / حفظ PDF</button><button class="btn btn-primary" id="pdfBtn">تنزيل PDF</button></div></div>
  <div class="book-wrap"><div class="notice">الغلاف يستخدم صورة الطفل الأصلية داخل إطار آمن حاليًا. عند ربط محرك الصور لاحقًا، ستُستبدل تلقائيًا بصورة البطل المرسومة مع الحفاظ على نفس قالب الـPDF.</div><main class="book" id="book"></main></div>
<script>
const STORAGE_KEY='colorverse-book-draft-v2',PHOTO_KEY='colorverse-child-photo';const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let draft={};try{draft=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')||{}}catch{}const photo=localStorage.getItem(PHOTO_KEY)||'';
const templates={space:{label:'مغامرة في الفضاء',cover:'public/marketing/cover-space.webp',chip:'مغامرة فضائية'},princess:{label:'عالم الأميرات',cover:'public/marketing/cover-princess.webp',chip:'قصة ساحرة'},jungle:{label:'حيوانات الغابة',cover:'public/marketing/cover-jungle.webp',chip:'مغامرة في الطبيعة'},hero:{label:'عالم الأبطال',cover:'public/marketing/cover-hero.webp',chip:'قصة بطولة'},unicorn:{label:'أحلام اليونيكورن',cover:'public/marketing/cover-unicorn.webp',chip:'خيال وألوان'}};
function title(){const h=(draft.heroName||draft.childName||'البطل الصغير').trim();if((draft.customTitle||'').trim())return draft.customTitle.trim();if(draft.template==='space')return 'مغامرة '+h+' بين النجوم';if(draft.template==='princess')return h+' وسر القصر الساحر';if(draft.template==='jungle')return h+' وأصدقاء الغابة';if(draft.template==='hero')return 'البطل '+h+' ينقذ المدينة';if(draft.template==='unicorn')return h+' وقوس القزح السحري';return h+' في مغامرة مدهشة'}function hero(){return (draft.heroName||draft.childName||'البطل الصغير').trim()}
function storyText(index){const h=hero(),f=draft.helper||'صديق لطيف',idea=draft.adventure||'مغامرة جميلة مليئة بالاكتشاف';const steps=[`بدأت الحكاية عندما قرر ${h} خوض مغامرة جديدة. كان الهدف واضحًا: ${idea}. جهّز ${h} كل ما يحتاجه وانطلق بقلب متحمس وخيال واسع.`,`في الطريق التقى ${h} بـ${f}، واتفقا على أن يكملا الرحلة معًا. اكتشفا أن التعاون يجعل أصعب الطرق أكثر سهولة ومتعة.`,`ظهرت أمامهما عقبة غير متوقعة، لكن ${h} توقف وفكر بهدوء. وبفكرة ذكية وشجاعة، تحولت المشكلة إلى فرصة لاكتشاف شيء جديد.`,`اقترب ${h} و${f} من الهدف، ووجدا إشارات صغيرة تقودهما في الاتجاه الصحيح. تعلما أن الانتباه للتفاصيل والصبر يصنعان فرقًا كبيرًا.`,`وصلت المغامرة إلى لحظتها الأهم. اختار ${h} أن يساعد الآخرين قبل أن يفكر في نفسه، ففتح هذا الاختيار الطريق إلى الحل.`,`نجحت المهمة وعادت البهجة إلى المكان. شكر الجميع ${h} و${f} على شجاعتهما وروحهما الطيبة.`,`في طريق العودة، تذكر ${h} كل ما تعلمه: الشجاعة لا تعني غياب الخوف، بل الاستمرار رغم وجوده، والتعاون يجعل النجاح أجمل.`,`انتهت الرحلة، لكن خيال ${h} كان قد فتح بابًا لمغامرات كثيرة قادمة. نام البطل سعيدًا وهو يعرف أن كل فكرة جميلة يمكن أن تصبح قصة.`];return steps[index%steps.length]}
function sheet(content,cls=''){return `<section class="sheet ${cls}">${content}</section>`}function coverPage(t,b){return sheet(`<img class="cover-bg" src="${esc(t.cover)}" alt=""><div class="cover-shade"></div><div class="cover-top"><img class="logo" src="public/brand/colorverse-logo-full.webp" alt="ColorVerse"><span class="cover-type">${esc(draft.coverStyle||'غلاف أساسي')}</span></div><div class="hero-photo" id="coverPhoto">${photo?`<img src="${photo}" alt="صورة البطل">`:''}</div><div class="cover-copy"><h1>${esc(b)}</h1><p>قصة مخصصة لـ ${esc(draft.childName||hero())}</p><small>${esc(t.label)} • ${esc(draft.output||'قصة + كتاب تلوين')}</small></div>`,'cover')}
function openingPage(t,b){return sheet(`<div class="opening-content"><img class="logo" src="public/brand/colorverse-logo-full.webp" alt="ColorVerse"><h2>${esc(b)}</h2><p class="dedication">صُنعت هذه القصة خصيصًا لـ <b>${esc(draft.childName||hero())}</b>، لتكون رحلة مليئة بالخيال والقراءة والتلوين واللحظات الجميلة.</p><div class="meta-card"><div><span>اسم البطل</span><b>${esc(hero())}</b></div><div><span>العمر</span><b>${esc(draft.age||'—')} سنوات</b></div><div><span>عالم القصة</span><b>${esc(t.label)}</b></div><div><span>لغة الكتاب</span><b>${esc(draft.language||'العربية')}</b></div><div><span>الصديق المساعد</span><b>${esc(draft.helper||'—')}</b></div><div><span>تاريخ الإنشاء</span><b>${new Date().toLocaleDateString('ar-SA')}</b></div></div></div>`,'opening')}
function storyPage(i,t){return sheet(`<div class="page-inner"><div class="page-header"><img class="mini-logo" src="public/brand/colorverse-planet-icon.webp" alt=""><span class="page-chip">${esc(t.chip)} • المشهد ${i+1}</span></div><img class="story-image" src="public/marketing/hero-story-page.webp" alt="مشهد القصة"><div class="story-box"><h3>${esc(hero())} — المشهد ${i+1}</h3><p>${esc(storyText(i))}</p></div><div class="page-number">${i+1}</div></div>`)}function coloringPage(i){return sheet(`<div class="page-inner"><div class="page-header"><img class="mini-logo" src="public/brand/colorverse-planet-icon.webp" alt=""><span class="page-chip">صفحة تلوين ${i+1}</span></div><div class="coloring-frame"><img src="public/marketing/hero-coloring-page.webp" alt="صفحة تلوين"></div><div class="coloring-title">لوّن مشهد ${esc(hero())} بطريقتك الخاصة</div><div class="page-number">${i+1}</div></div>`,'coloring-sheet')}
function endingPage(){return sheet(`<div class="ending-content"><img class="logo" src="public/brand/colorverse-logo-full.webp" alt="ColorVerse"><h2>أحسنت يا ${esc(draft.childName||hero())}!</h2><p>انتهت القصة، لكن الخيال لا ينتهي. نتمنى لك وقتًا ممتعًا في القراءة والتلوين وصناعة مغامرتك القادمة.</p><div class="signature"><span>هذا الكتاب يعود إلى</span><strong>${esc(draft.childName||hero())}</strong></div></div>`,'ending')}
function render(){const t=templates[draft.template];if(!t||!draft.childName){$('#book').innerHTML='<div class="empty"><div class="empty-card"><h1>لا توجد بيانات كتاب مكتملة</h1><p>ارجع إلى صفحة الإنشاء وأكمل النموذج أولًا.</p><a class="btn btn-primary" href="create.html">فتح استوديو الإنشاء</a></div></div>';$('#pdfBtn').disabled=true;return}const b=title();let html=coverPage(t,b)+openingPage(t,b);const requested=Math.max(8,Math.min(16,Number(draft.pages)||8)),output=draft.output||'قصة + كتاب تلوين';if(output.includes('قصة')&&output.includes('تلوين')){const scenes=Math.max(4,Math.floor(requested/2));for(let i=0;i<scenes;i++)html+=storyPage(i,t)+coloringPage(i)}else if(output.includes('تلوين')){for(let i=0;i<requested;i++)html+=coloringPage(i)}else{for(let i=0;i<requested;i++)html+=storyPage(i,t)}html+=endingPage();$('#book').innerHTML=html;const p=$('#coverPhoto');if(p&&photo)p.style.display='block';document.title=b+' | ColorVerse';$('#status').textContent='جاهز: '+document.querySelectorAll('.sheet').length+' صفحات'}
$('#printBtn').addEventListener('click',()=>window.print());$('#pdfBtn').addEventListener('click',async()=>{const btn=$('#pdfBtn');btn.disabled=true;btn.textContent='جارٍ إنشاء PDF…';try{if(!window.html2pdf)throw new Error('pdf');const filename=(title()||'colorverse-book').replace(/[\\/:*?"<>|]/g,'-')+'.pdf';await html2pdf().set({margin:0,filename,image:{type:'jpeg',quality:.96},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from($('#book')).save()}catch(e){alert('تعذر التنزيل المباشر. سيتم فتح نافذة الطباعة، واختر حفظ بصيغة PDF.');window.print()}finally{btn.disabled=false;btn.textContent='تنزيل PDF'}});render();
</script>
</body>
</html>
